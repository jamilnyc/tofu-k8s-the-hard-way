#cloud-config
ssh_pwauth: false
# Debian's stock cloud image ships disable_root: true, which makes cloud-init's
# own ssh module wrap the AWS-injected metadata key in a forced `command=` that
# prints "Please login as user ... rather than root" and disconnects. sshd
# matches the first authorized_keys entry for a given key, so that wrapper
# entry always wins over the plain one runcmd appends below. Disabling it here
# stops cloud-init from installing the wrapper at all.
disable_root: false
write_files:
  - path: /etc/ssh/sshd_config.d/99-permit-root.conf
    content: |
      PermitRootLogin yes
  # Debian's default root shell has no color/prompt customization; this makes
  # an interactive root session (which is all we get on these boxes) legible.
  - path: /root/.bashrc
    append: true
    content: |

      # Colored prompt: user@host in green, current directory in blue.
      export PS1='\[\e[32m\]\u@\h\[\e[0m\]:\[\e[34m\]\w\[\e[0m\]\$ '
      alias ls='ls --color=auto'
      alias grep='grep --color=auto'
      alias egrep='egrep --color=auto'
      alias fgrep='fgrep --color=auto'
%{ if setup_script != "" }
  # Present only for machines with a "<name>-setup.sh" file in the repo root
  # (see instances.tf); installed here so runcmd below can execute it on
  # first boot.
  - path: /root/setup.sh
    permissions: '0755'
    content: |
      ${indent(6, setup_script)}
%{ endif }
%{ if machines_txt != "" }
  # Only present on the jumpbox (see instances.tf): the KTHW docs use this
  # file from there to loop over the server and worker nodes for ssh/scp.
  - path: /root/machines.txt
    content: |
      ${indent(6, machines_txt)}
%{ endif }
%{ if ssh_private_key != "" }
  # Only present on the jumpbox: the same key already trusted by every node's
  # authorized_keys (see runcmd below), so the jumpbox can ssh/scp to the
  # server and worker nodes as root -- required by hosts-setup.sh. Mode 0600
  # up front since sshd refuses a key file any group/world bits can touch.
  - path: /root/.ssh/id_ed25519
    permissions: '0600'
    content: |
      ${indent(6, ssh_private_key)}
%{ endif }
%{ if hosts_setup_script != "" }
  # Only present on the jumpbox; needs machines.txt and the private key
  # above, so it's installed here and run before setup.sh in runcmd below.
  - path: /root/hosts-setup.sh
    permissions: '0755'
    content: |
      ${indent(6, hosts_setup_script)}
%{ endif }
runcmd:
  - mkdir -p /root/.ssh
  - chmod 700 /root/.ssh
  - echo "${ssh_public_key}" >> /root/.ssh/authorized_keys
  - chmod 600 /root/.ssh/authorized_keys
  - systemctl restart ssh
%{ if hosts_setup_script != "" }
  # Runs before setup.sh: the other 3 nodes are booting in parallel and may
  # still be mid-boot, so this waits for each one's ssh to come up (see
  # hosts-setup.sh) and gets hostnames resolvable in /etc/hosts -- setup.sh's
  # certificate distribution below needs to `ssh root@node-0` etc. by name.
  - bash /root/hosts-setup.sh > /var/log/hosts-setup.log 2>&1
%{ endif }
%{ if setup_script != "" }
  # Runs unattended, so log to a file rather than relying on console output;
  # a non-zero exit here logs a cloud-init warning but doesn't fail the boot.
  - bash /root/setup.sh > /var/log/setup.log 2>&1
%{ endif }
